<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Apply a saved light/dark pick before the page paints, so it doesn't flash.
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3e8e47" />
    <meta
      name="description"
      content="Brandon Rodriguez: software engineer at Walmart Marketplace, based in the Bay Area. Web apps, data tools, and a lot of soccer charts."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bjrodrigu.github.io/" />
    <meta property="og:title" content="Brandon Rodriguez" />
    <meta property="og:description" content="Software engineer. Web apps, data tools and soccer charts." />
    <meta property="og:image" content="https://bjrodrigu.github.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Brandon Rodriguez, next to a pixel-art soccer pitch showing a passing move that ends in a goal" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint; text shows in a fallback first. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Silkscreen&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Silkscreen&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Silkscreen&display=swap" /></noscript>
    <title>Brandon Rodriguez</title>
  </head>
  <body>
    <noscript>This site needs JavaScript to run.</noscript>
    <div id="root"></div>
  </body>
</html>
